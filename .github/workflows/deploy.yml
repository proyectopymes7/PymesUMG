name: Production Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Puerta de seguridad: SAST + SCA + deteccion de secretos.
  # Si falla, el despliegue NO se ejecuta.
  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  deploy:
    needs: security
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update repository
        run: |
          cd /var/www/pymes-temp
          git pull origin master

      - name: Sync backend
        run: |
          rsync -av --delete --exclude='.env' \
          /var/www/pymes-temp/Backend/ \
          /var/www/backend/

      - name: Install backend dependencies
        run: |
          cd /var/www/backend
          npm install

      - name: Restart backend API
        run: |
          cd /var/www/backend
          pm2 restart backend --update-env || pm2 start server.js --name backend
          pm2 save

      - name: Sync frontend
        run: |
          rsync -av --delete --exclude='.env' \
          /var/www/pymes-temp/Frontend/ \
          /var/www/frontend/

      - name: Install frontend dependencies
        run: |
          cd /var/www/frontend
          npm install

      - name: Build frontend
        run: |
          cd /var/www/frontend
          npm run build

      - name: Restart Nginx
        run: |
          sudo systemctl restart nginx
